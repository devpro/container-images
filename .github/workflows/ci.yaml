name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content-validate:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e

  runner-image-scan:
    name: "Image ${{ matrix.image-name }}"
    strategy:
      matrix:
        # A Playwright image is scanned on the base this commit builds, not on the one last published.
        include:
          - image-name: alpine-node
          - image-name: debian-node
          - image-name: debian-node-playwright
            base-image-definition: src/debian-node/Dockerfile
          - image-name: ubuntu-dotnet
          - image-name: ubuntu-dotnet-playwright
            base-image-definition: src/ubuntu-dotnet/Dockerfile
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-scan.yml@13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
    with:
      base-image-definition: ${{ matrix.base-image-definition || '' }}
      image-definition: src/${{ matrix.image-name }}/Dockerfile
      image-name: ${{ matrix.image-name }}
      image-path: ghcr.io/${{ github.repository_owner }}
      image-tag: "1.0.${{ github.run_id }}"
      workflow-parts-version: 13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
