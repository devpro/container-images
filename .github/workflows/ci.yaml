name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content-validate:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@35750e9d1a21724d3a7e028ee9bc6da02dcb5afb

  runner-image-scan:
    name: "Image ${{ matrix.image-name }}"
    strategy:
      matrix:
        image-name:
          - debian-node
          - debian-node-playwright
          - ubuntu-dotnet
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-scan.yml@35750e9d1a21724d3a7e028ee9bc6da02dcb5afb
    with:
      image-definition: src/${{ matrix.image-name }}/Dockerfile
      image-name: ${{ matrix.image-name }}
      image-path: ghcr.io/${{ github.repository_owner }}
      image-tag: "1.0.${{ github.run_id }}"
      workflow-parts-version: 35750e9d1a21724d3a7e028ee9bc6da02dcb5afb

