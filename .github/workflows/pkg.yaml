name: PKG

on:
  push:
    branches: ["main"]
  # A weekly rebuild takes in the base images and the packages published since, which a repository changing rarely would otherwise never get.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch: {}

jobs:
  runner-image-publication:
    name: "Image ${{ matrix.image-name }}"
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        image-name:
          - alpine-node
          - debian-node
          - ubuntu-dotnet
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-publication.yml@13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
    with:
      container-registry: ghcr.io
      create-latest: ${{ github.ref_name == 'main' }}
      image-definition: src/${{ matrix.image-name }}/Dockerfile
      image-name: ${{ matrix.image-name }}
      image-path: ghcr.io/${{ github.repository_owner }}
      image-tag: "1.0.${{ github.run_id }}"
      image-platform: linux/amd64
      workflow-parts-version: 13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
    secrets:
      container-registry-username: ${{ github.actor }}
      container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  runner-image-publication-playwright:
    name: "Image debian-node-playwright"
    needs: runner-image-publication
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-publication.yml@13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
    with:
      container-registry: ghcr.io
      create-latest: ${{ github.ref_name == 'main' }}
      extra-build-arguments: BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/debian-node:1.0.${{ github.run_id }}
      image-definition: src/debian-node-playwright/Dockerfile
      image-name: debian-node-playwright
      image-path: ghcr.io/${{ github.repository_owner }}
      image-tag: "1.0.${{ github.run_id }}"
      image-platform: linux/amd64
      workflow-parts-version: 13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
    secrets:
      container-registry-username: ${{ github.actor }}
      container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  runner-image-publication-dotnet-playwright:
    name: "Image ubuntu-dotnet-playwright"
    needs: runner-image-publication
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-publication.yml@13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
    with:
      container-registry: ghcr.io
      create-latest: ${{ github.ref_name == 'main' }}
      extra-build-arguments: BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/ubuntu-dotnet:1.0.${{ github.run_id }}
      image-definition: src/ubuntu-dotnet-playwright/Dockerfile
      image-name: ubuntu-dotnet-playwright
      image-path: ghcr.io/${{ github.repository_owner }}
      image-tag: "1.0.${{ github.run_id }}"
      image-platform: linux/amd64
      workflow-parts-version: 13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
    secrets:
      container-registry-username: ${{ github.actor }}
      container-registry-password: ${{ secrets.GITHUB_TOKEN }}
