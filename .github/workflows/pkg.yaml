name: PKG

on:
  push:
    branches: ["main"]
  # rebuilds every week to take the base images and packages published since
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      images:
        description: Images to publish, separated by commas, every image when empty
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  select:
    name: Select the images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner-images: ${{ steps.select.outputs.runner-images }}
      demo-images: ${{ steps.select.outputs.demo-images }}
      ubuntu-node: ${{ steps.select.outputs.ubuntu-node }}
      ubuntu-node-playwright: ${{ steps.select.outputs.ubuntu-node-playwright }}
      ubuntu-dotnet-playwright: ${{ steps.select.outputs.ubuntu-dotnet-playwright }}
    steps:
      - name: Select the images to publish
        id: select
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          runner='["alpine-node","ubuntu-dotnet"]'
          # Images built on another one, or once per Node.js major, have jobs of their own.
          own='["ubuntu-node","ubuntu-node-playwright","ubuntu-dotnet-playwright"]'
          demo='["cow-demo","game-2048","rancher-helloworld","redirect-server"]'
          known=$(jq -nc --argjson a "$runner" --argjson b "$own" --argjson c "$demo" '$a + $b + $c')
          # A push or a scheduled run publishes every image, as does a manual run naming none.
          if [ -z "${IMAGES// /}" ]; then
            selected="$known"
          else
            selected=$(jq -nc --arg images "$IMAGES" '$images | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))')
            unknown=$(jq -nc --argjson s "$selected" --argjson k "$known" '$s - $k')
            if [ "$unknown" != "[]" ]; then
              echo "::error::Unknown images: $unknown, known ones being $known"
              exit 1
            fi
          fi
          {
            echo "runner-images=$(jq -nc --argjson s "$selected" --argjson l "$runner" '$l | map(select(. as $i | $s | index($i)))')"
            echo "demo-images=$(jq -nc --argjson s "$selected" --argjson l "$demo" '$l | map(select(. as $i | $s | index($i)))')"
            echo "ubuntu-node=$(jq -nc --argjson s "$selected" '$s | index("ubuntu-node") != null')"
            echo "ubuntu-node-playwright=$(jq -nc --argjson s "$selected" '$s | index("ubuntu-node-playwright") != null')"
            echo "ubuntu-dotnet-playwright=$(jq -nc --argjson s "$selected" '$s | index("ubuntu-dotnet-playwright") != null')"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  runner-image-publication:
    name: "Image ${{ matrix.image-name }}"
    needs: select
    if: needs.select.outputs.runner-images != '[]'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        image-name: ${{ fromJSON(needs.select.outputs.runner-images) }}
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-publication.yml@5379b9d0052e3b233ec2e56ba8678e827361b89e
    with:
      container-registry: ghcr.io
      create-latest: ${{ github.ref_name == 'main' }}
      image-definition: src/${{ matrix.image-name }}/Dockerfile
      image-name: ${{ matrix.image-name }}
      image-path: ghcr.io/${{ github.repository_owner }}
      image-tag: "1.0.${{ github.run_id }}"
      arm64-runner: ubuntu-26.04-arm
      workflow-parts-version: 5379b9d0052e3b233ec2e56ba8678e827361b89e
    secrets:
      container-registry-username: ${{ github.actor }}
      container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  # One image per Node.js major of the ubuntu-latest tools cache, so that IstarCI gives a job the major its actions/setup-node asks for, as GitHub does.
  # The major is a moving tag, as latest is, and only main moves them, a run of another branch publishing under a tag of its own.
  node-image-publication:
    name: "Image ubuntu-node:${{ matrix.node }}"
    needs: select
    if: needs.select.outputs.ubuntu-node == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        node: ["22", "24"]
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-publication.yml@5379b9d0052e3b233ec2e56ba8678e827361b89e
    with:
      container-registry: ghcr.io
      # latest is the default Node.js of ubuntu-latest.
      create-latest: ${{ github.ref_name == 'main' && matrix.node == '24' }}
      extra-build-arguments: NODE_VERSION=${{ matrix.node }}
      image-definition: src/ubuntu-node/Dockerfile
      image-name: ubuntu-node
      image-path: ghcr.io/${{ github.repository_owner }}
      image-tag: ${{ github.ref_name == 'main' && matrix.node || format('{0}-1.0.{1}', matrix.node, github.run_id) }}
      arm64-runner: ubuntu-26.04-arm
      workflow-parts-version: 5379b9d0052e3b233ec2e56ba8678e827361b89e
    secrets:
      container-registry-username: ${{ github.actor }}
      container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  node-image-publication-playwright:
    name: "Image ubuntu-node-playwright:${{ matrix.node }}"
    needs: [select, node-image-publication]
    if: ${{ !cancelled() && needs.select.outputs.ubuntu-node-playwright == 'true' && needs.node-image-publication.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        node: ["22", "24"]
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-publication.yml@5379b9d0052e3b233ec2e56ba8678e827361b89e
    with:
      container-registry: ghcr.io
      create-latest: ${{ github.ref_name == 'main' && matrix.node == '24' }}
      # The base is the one this run published, or the published one of the same major when this run left it out.
      extra-build-arguments: BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/ubuntu-node:${{ (needs.select.outputs.ubuntu-node == 'true' && github.ref_name != 'main') && format('{0}-1.0.{1}', matrix.node, github.run_id) || matrix.node }}
      image-definition: src/ubuntu-node-playwright/Dockerfile
      image-name: ubuntu-node-playwright
      image-path: ghcr.io/${{ github.repository_owner }}
      image-tag: ${{ github.ref_name == 'main' && matrix.node || format('{0}-1.0.{1}', matrix.node, github.run_id) }}
      arm64-runner: ubuntu-26.04-arm
      workflow-parts-version: 5379b9d0052e3b233ec2e56ba8678e827361b89e
    secrets:
      container-registry-username: ${{ github.actor }}
      container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  runner-image-publication-dotnet-playwright:
    name: "Image ubuntu-dotnet-playwright"
    needs: [select, runner-image-publication]
    if: ${{ !cancelled() && needs.select.outputs.ubuntu-dotnet-playwright == 'true' && needs.runner-image-publication.result != 'failure' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-publication.yml@5379b9d0052e3b233ec2e56ba8678e827361b89e
    with:
      container-registry: ghcr.io
      create-latest: ${{ github.ref_name == 'main' }}
      extra-build-arguments: BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/ubuntu-dotnet:${{ contains(needs.select.outputs.runner-images, '"ubuntu-dotnet"') && format('1.0.{0}', github.run_id) || 'latest' }}
      image-definition: src/ubuntu-dotnet-playwright/Dockerfile
      image-name: ubuntu-dotnet-playwright
      image-path: ghcr.io/${{ github.repository_owner }}
      image-tag: "1.0.${{ github.run_id }}"
      arm64-runner: ubuntu-26.04-arm
      workflow-parts-version: 5379b9d0052e3b233ec2e56ba8678e827361b89e
    secrets:
      container-registry-username: ${{ github.actor }}
      container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  demo-image-publication:
    name: "Image ${{ matrix.image-name }}"
    needs: select
    if: needs.select.outputs.demo-images != '[]'
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        image-name: ${{ fromJSON(needs.select.outputs.demo-images) }}
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-publication.yml@5379b9d0052e3b233ec2e56ba8678e827361b89e
    with:
      container-registry: docker.io
      create-latest: ${{ github.ref_name == 'main' }}
      image-definition: Dockerfile
      image-name: ${{ matrix.image-name }}
      image-path: docker.io/devprofr
      image-tag: "1.0.${{ github.run_id }}"
      image-platform: linux/amd64
      workflow-parts-version: 5379b9d0052e3b233ec2e56ba8678e827361b89e
      working-directory: src/${{ matrix.image-name }}
    secrets:
      container-registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      container-registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
