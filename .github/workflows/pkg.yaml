name: PKG

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  runner-image-publication:
    name: "Image ${{ matrix.image-name }}"
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        image-name:
          - debian-node
          - ubuntu-dotnet
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-publication.yml@58dbfe0e9927f2191796ac616a4bb43126e59d98
    with:
      container-registry: ghcr.io
      create-latest: ${{ github.ref_name == 'main' }}
      image-definition: src/${{ matrix.image-name }}/Dockerfile
      image-name: ${{ matrix.image-name }}
      image-path: ghcr.io/${{ github.repository_owner }}
      image-tag: "1.0.${{ github.run_id }}"
      image-platform: linux/amd64
      workflow-parts-version: 58dbfe0e9927f2191796ac616a4bb43126e59d98
    secrets:
      container-registry-username: ${{ github.actor }}
      container-registry-password: ${{ secrets.GITHUB_TOKEN }}

