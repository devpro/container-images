# IstarCI configuration, read from the root of the repository.

runner:
  image: ghcr.io/devpro/ubuntu-node:latest
  # The scan jobs build an image and scan it through the host Docker daemon, and the parity check builds one and runs it.
  docker: ["runner-image-scan*", "demo-image-scan*", "runner-parity*"]

workflow:
  onDisallowedAction: fail
  # GitHub's own actions, and the composite replacements for every other one kept in github-workflow-parts.
  allowedActions:
    - actions/*
    - github/*
    - devpro/github-workflow-parts/*
  # Delivery publishes on a push to the default branch, which a local run must never reach.
  exclude:
    - pkg.yaml
